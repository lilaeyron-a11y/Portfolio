openapi: 3.0.0

info:
  title: Projects API
  version: 1.0.0
  description: API for creating and retrieving portfolio projects.

paths:
  /api/projects:
    get:
      summary: Get all projects
      description: Returns all projects stored in the database.
      responses:
        '200':
          description: A list of projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: My Portfolio
                    type:
                      type: string
                      example: Technical Writing
    post:
      summary: Create a project
      description: Creates a new project and stores it in the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
              properties:
                name:
                  type: string
                  example: API Documentation Test
                type:
                  type: string
                  example: Developer Documentation
'200':
  description: Project created successfully.
  content:
    application/json:
      schema:
        type: object
        required:
          - id
          - name
          - type
        properties:
          id:
            type: integer
            example: 6
          name:
            type: string
            example: API Documentation Test
          type:
            type: string
            example: Developer Documentation

        '400':
          description: Name and type are required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: name and type are required